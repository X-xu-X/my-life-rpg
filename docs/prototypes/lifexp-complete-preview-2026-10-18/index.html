function dayData(){return state.days[state.day]||(state.days[state.day]={claimed:false,used:0,allowance:null})}
function firstRecord(){return state.records.some(r=>r.savedDay===state.day&&!r.seedOnly)}
function eligible(){return firstRecord()}
function allowance(){const d=dayData();if(eligible()&&d.allowance===null)d.allowance=state.profile.minutes;return d.allowance??state.profile.minutes}
function remaining(){return Math.max(0,allowance()*60-dayData().used)}
function ledger(amount,title,key,source='行动',day=state.day){if(state.ledger.some(x=>x.key===key))return false;if(state.coins+amount<0)return false;state.coins+=amount;state.ledger.unshift({id:uid(),key,amount,title,source,day});return true}
function toast(text){clearTimeout(toastId);$('#toast').textContent=text;$('#toast').hidden=false;toastId=setTimeout(()=>$('#toast').hidden=true,2300)}
function baseActiveNav(){return ({diary:'handbook',record:'handbook',rewards:'growth',timer:'growth',questionnaire:'my',profile:'my',comeback:'my',feedback:'my',guide:'my',admin:'admin'})[state.route]||state.route}
function baseNav(){const list=state.role==='admin'?[['admin','反馈管理','book'],['guide','审阅本版','plans']]:[['today','今天','today'],['handbook','手账','book'],['plans','计划','plans'],['growth','成长','growth'],['my','我的','my']];const html=list.map(([r,n,i])=>`<a href="#${r}" class="${activeNav()===r?'active':''}">${icon(i)}<span>${n}</span></a>`).join('');$('#desktop-nav').innerHTML=html;$('#mobile-nav').innerHTML=html;$('#identity').textContent=state.role==='admin'?'管理体验 · 虚构账号':'小林 · 体验账号';$('#scenario').value=state.scenario}
function baseGo(route){if(state.role==='admin'&&!['admin','guide'].includes(route))route='admin';state.route=route;save();if(location.hash.slice(1)!==route)history.replaceState(null,'','#'+route);render();window.scrollTo({top:0})}
const back=(to='today')=>`<a class="page-back" href="#${to}">${icon('back')}返回${({today:'今天',my:'我的',growth:'成长',plans:'计划',rewards:'奖励',handbook:'手账'})[to]||'上一页'}</a>`;
const heading=(title,sub,extra='')=>`<div class="heading"><div><div class="eyebrow">LifeXP · ${state.role==='admin'?'管理工作区':'按自己的节奏'}</div><h1>${title}</h1><p class="subtitle">${sub}</p></div>${extra}</div>`;
const baseSubnav=()=>`<div class="subnav"><a href="#growth" class="${state.route==='growth'?'active':''}">成长与成就</a><a href="#rewards" class="${state.route==='rewards'?'active':''}">奖励与娱乐</a></div>`;
function openDialog(title,body,action=null,confirm='确认'){dialogAction=action;$('#dialog-body').innerHTML=`<div class="dialog-head"><h2 id="dialog-title">${title}</h2><button class="close" data-action="close" aria-label="关闭">×</button></div>${body}${action?`<div class="modal-actions"><button class="btn" data-action="close">取消</button><button class="btn primary" id="dialog-confirm" data-action="dialog-confirm">${confirm}</button></div>`:''}`;if(!$('#dialog').open)$('#dialog').showModal()}
function closeDialog(){$('#dialog').close();dialogAction=null}
function failDialog(text){let e=$('#dialog-error');if(!e){e=document.createElement('p');e.id='dialog-error';e.className='error';$('#dialog-body').append(e)}e.textContent=text;return false}
function plansToday(){ensureGoals();return state.plans.filter(p=>{const w=weekday(state.day),delta=Math.round((new Date(state.day+'T12:00Z')-new Date((p.anchor||state.day)+'T12:00Z'))/86400000);return p.when==='daily'||p.when==='monday'&&w===1||p.when==='weekdays'&&w>=1&&w<=5||p.when==='weekends'&&(w===0||w===6)||p.when==='weekly'&&(p.weekdays||[]).includes(w)||p.when==='once'&&state.day===p.anchor||['alternate','interval'].includes(p.when)&&delta>=0&&delta%(p.when==='alternate'?2:p.interval)===0})}

function outcome(p){return state.outcomes[p.id+'@'+state.day]}
function planRow(p){const o=outcome(p),r=state.records.find(r=>r.id===o?.record);return `<div class="plan"><div class="row between"><h3>${esc(p.title)} <span class="muted small">${p.minutes} 分钟</span></h3>${o?`<span class="tag ${o.status==='missed'?'':'green'}">${o.status==='missed'?'未完成 · 已记录':r?.settled?'已入账':'已记录 · 待确认'}</span>`:''}</div><p>${esc(p.goal||'暂未关联目标')}${p.main?' · <span style="color:var(--blue)">当前主线</span>':''} · ${esc(scheduleLabel(p))}</p>${o?(o.status==='missed'?'<span class="small muted">结果已确认。需要纠正时可说明情况。</span>':`<div class="reward-strip">${o.status==='partial'?'部分完成':'完成'} · ${esc(r?.text||'')}<br><button class="text-button" data-action="open-record" data-id="${o.record}">${r?.settled?'查看事实与入账':'查看奖励建议 →'}</button></div>`):`<div class="plan-actions"><button class="btn soft" data-action="plan-outcome" data-id="${p.id}" data-result="done">完成</button><button class="btn" data-action="plan-outcome" data-id="${p.id}" data-result="partial">部分完成</button><button class="btn" data-action="plan-missed" data-id="${p.id}">未完成</button><button class="text-button" data-action="start-plan" data-id="${p.id}">${icon('clock')} 开始计划</button></div>`}</div>`}
function timerBanner(){return state.timer?`<div class="banner running"><div><strong>${esc(state.timer.title)}</strong><p>${state.timer.status==='running'?'计时中':state.timer.status==='interrupted'?'中断待确认':'已暂停'} · <span data-elapsed>${timeText(elapsed())}</span></p></div><a class="btn soft" href="#timer">回到计时</a></div>`:''}
function baseToday(){const d=dayData(),draft=state.drafts['event@'+state.day]||'';return heading('今天，往前一点。','认真做一点，也给自己留一点自在。',`<input class="date-select" id="preview-day" aria-label="预览日期" type="date" value="${state.day}">`)+
 (state.scenario==='holiday'?`<div class="banner holiday"><div><strong>给今天一点节日的仪式感</strong><p>节日演示场景 · 礼金 10 币；有效学习/工作另有 20% 加成。</p></div><button class="btn" data-action="holiday" ${state.claims.includes('holiday@'+state.day)?'disabled':''}>${state.claims.includes('holiday@'+state.day)?'已领取':'领取节日礼金'}</button></div>`:'')+
 (state.scenario==='return'&&!state.returnStatus?`<div class="banner"><div><strong>好久不见，最近怎么样？</strong><p>用几个小问题更新近况，让之后的安排更适合现在的你。</p></div><a class="btn" href="#comeback">更新一下近况</a></div>`:'')+timerBanner()+
 `<div class="two-col today-layout"><div class="stack"><section class="card compose"><div class="section-title"><h2>记下一件小事</h2><button class="text-button" data-action="sample-record">填入体验文字</button></div><textarea id="event-text" data-draft="event@${state.day}" aria-label="事件原文" placeholder="做了什么，有了什么进展？想到哪儿，就写到哪儿。">${esc(draft)}</textarea><div class="compose-footer"><div><details style="margin:0"><summary>补记其他日期</summary><label class="field">内容所属日<input id="content-day" type="date" value="${state.day}" max="${state.day}"></label></details><p class="small muted" style="margin-top:8px">今天保存，就算今天记过。</p></div><button class="btn primary" data-action="save-event">保存记录</button></div></section>
 <section class="card today-plans"><div class="section-title"><h2>今日计划 <span class="small muted">${plansToday().length} 项</span></h2><a class="text-button" href="#plans">管理计划 →</a></div>${plansToday().map(planRow).join('')||'<p class="empty">今天没有到期安排，按自己的节奏来。</p>'}</section>
 <section class="card night-card"><div class="row between"><div><h2>给今天留一页</h2><p class="subtitle">写日记，也可以在保存后让 AI 帮你回顾。</p></div>${icon('book')}</div><a href="#diary" class="btn mt">${state.records.some(r=>r.kind==='diary'&&r.contentDay===state.day)?'继续今天的日记':'写晚间日记'}</a></section></div>
 <div class="stack"><section class="card rest-card"><div class="section-title"><h3>今天的基础娱乐</h3><span class="tag blue">${eligible()?'已解锁':'首记解锁'}</span></div><div class="rest-number">${Math.ceil(remaining()/60)}<span>/ ${allowance()} 分钟</span></div><p class="subtitle">${eligible()?'免费额度已就绪，可以分几次使用。':'先留下一条事件或日记，开启今天的免费额度。'}</p><button class="btn primary full" data-action="start-free" ${!eligible()||remaining()<=0?'disabled':''}>${icon('game')}开始娱乐</button><div class="row between mt"><span class="small muted">首记签到 · 3 币</span><button class="text-button" data-action="claim-first" ${!eligible()||d.claimed||!state.profile.built?'disabled':''}>${d.claimed?'已领取':'领取'}</button></div><details><summary>额度与金币有什么区别？</summary><div class="body">基础时长由你设定，首记后免费使用；额外娱乐再用金币兑换。午睡、散步、远眺等基本休息不需要兑换。<br><a href="#profile">调整额度与约定 →</a></div></details></section>
 <section class="card care-card"><div class="section-title"><h3>也记得照顾自己</h3><span class="small muted">可跳过</span></div>${['睡眠','饮食','活动'].map((n,i)=>`<div class="mini-item"><span class="icon-box">${icon(['moon','coffee','today'][i])}</span><div><strong>${n}</strong><p>${esc(state.care[state.day+'@'+n]||'还没记录，不代表没有做')}</p></div><button class="text-button" data-action="care" data-id="${n}">${state.care[state.day+'@'+n]?'修改':'记一下'}</button></div>`).join('')}<div class="care-rest">基本休息一直自由。想午睡、远眺或发会儿呆，就放心休息。</div></section>
 <section class="card wallet-card"><div class="row between"><div class="balance"><strong>${state.coins}</strong><span>金币</span></div><a href="#rewards" class="text-button">挑个奖励 →</a></div><p class="daily-note">${esc(state.goals.find(g=>g.main)?'当前主线：'+state.goals.find(g=>g.main).title+'。每一点真实推进都能留下来。':'目标由你来定，日常的小行动也值得记录。')}</p></section></div></div>`}
function plansPage(){ensureGoals();return heading('计划与目标','目标由你来定，今天只出现今天的安排。')+`<section class="card mb"><div class="section-title"><h2>我的目标</h2><button class="btn soft" data-action="new-goal">＋ 写下目标</button></div>${state.goals.map(g=>`<div class="list-row"><div><h3>${esc(g.title)} ${g.main?'<span class="tag blue">当前主线</span>':''}</h3><small>${esc(g.note||'可以补充想做到什么')}${g.deadline?' · 期限 '+esc(g.deadline):''}</small></div><button class="text-button" data-action="edit-goal" data-id="${g.id}">编辑</button></div>`).join('')||'<p class="empty">先写一个自己想推进的目标，也可以直接安排日常计划。</p>'}</section><section class="card"><div class="section-title"><div><h2>我的全部计划 <span class="small muted">${state.plans.length} 项</span></h2><button class="text-button" data-full="progress-advice">回看近期推进（模拟）</button></div><button class="btn soft" data-action="new-plan">＋ 新计划</button></div>${state.plans.map(p=>`<div class="list-row"><div><h3>${esc(p.title)}</h3><small>${esc(p.goal||'暂未关联目标')} · ${esc(scheduleLabel(p))} · ${p.minutes} 分钟</small></div><button class="text-button" data-action="edit-plan" data-id="${p.id}">编辑</button></div>`).join('')}</section>`}

function addRecord(text,kind='event',contentDay=state.day,extra={}){const r={id:uid(),text,kind,contentDay,savedDay:state.day,settled:false,reviews:[],...extra};state.records.unshift(r);if(dayData().allowance===null)dayData().allowance=state.profile.minutes;save();return r}
function baseRecordPage(){const r=state.records.find(x=>x.id===state.activeRecord);if(!r)return back('handbook')+heading('没有找到这条记录','回到手账查看保存的内容。');return back(r.planId?'plans':'handbook')+heading('这一件事','原文与你确认过的结果，一起保留。')+`<section class="card mb"><div class="row between mb"><span class="tag green">已保存</span><span class="small muted">保存日 ${r.savedDay} · 内容所属日 ${r.contentDay}</span></div><p class="detail-original">${esc(r.text)}</p></section><section class="card"><div class="section-title"><h2>分析与奖励建议</h2><span class="tag ${r.settled?'green':'blue'}">${r.settled?'已确认':'脚本预览'}</span></div>${r.settled?`<div class="reward-strip">${r.award===undefined?'这条历史样例已结算。':`已入账 ${r.award} 币 · ${esc(r.attribute||'依据实际行动保留属性建议')}`}</div><p class="daily-note">同一事实通过计划或计时再次出现，不会重复发奖。</p>`:r.suggestion?rewardView(r):`<p class="muted small">根据这件事的实际投入与成果，建议属性变化、金币和目标关联。</p>${r.clarify?`<p class="quote">${esc(r.clarify)}</p><button class="btn primary mt" data-action="correct-record">补充这件事</button>`:`<button class="btn primary mt" data-action="analyze-record">分析这件事（模拟）</button>`}<p class="daily-note">Demo 用简化规则演示流程；正式版本由你配置的 AI 分析。</p>`}</section>`}
function calculation(r){const s=r.suggestion,base=[6,15,25][s.grade],bonus=s.main?[4,10,15][s.grade]:0,holiday=s.holiday?Math.floor((base+bonus)*.2):0,used=state.ledger.filter(x=>x.day===state.day&&x.source==='行动').reduce((n,x)=>n+x.amount,0);return {base,bonus,holiday,used,total:Math.min(40,Math.max(0,100-used),base+bonus+holiday)}}
function rewardView(r){const c=calculation(r),g=state.goals.find(g=>g.id===r.suggestion.goalId);return `<p class="quote">围绕你记录的行动给出以下建议，请核对事实后再确认。</p><div class="row between wrap"><span class="small">关联目标：${esc(g?.title||'未发现明确关联')}${r.suggestion.main?' · 主线相关':''}</span><button class="text-button" data-action="correct-record">关联不对？修正</button></div><div class="calc"><div><span>有效行动 · ${['小步推进','持续有效投入','重要阶段推进'][r.suggestion.grade]}</span><strong>+${c.base}</strong></div><div><span>主线额外奖励</span><strong>+${c.bonus}</strong></div>${c.holiday?`<div><span>节日有效努力加成</span><strong>+${c.holiday}</strong></div>`:''}<div class="total"><span>本次建议入账</span><strong class="positive">${c.total} 币</strong></div></div><div class="note">属性建议：${esc(r.suggestion.attribute||'智力 +0.4')}（示例）。主线加成只影响金币。</div><details><summary>查看依据与计算规则</summary><div class="body">原文：${esc(r.text)}${r.supplement?'<br>你的补充：'+esc(r.supplement):''}<br>简化脚本依据行动词和目标描述匹配，本版不调用真实 AI。正式分析需要引用具体事实，并允许修正。<br>今日行动已入账 ${c.used} / 100 币；单事实最多 40 币。同一事实通过计划或计时出现，不重复发奖。</div></details><div class="row wrap mt"><button class="btn primary" data-action="confirm-reward">确认入账</button><button class="btn" data-action="correct-record">补充 / 修正</button></div>`}

function baseHandbook(){const records=state.records.filter(r=>!state.filter||state.filter==='all'||r.kind===state.filter);return heading('手账','事件与日记，各自留下痕迹。')+`<div class="subnav">${[['all','全部'],['event','事件'],['diary','日记']].map(([k,n])=>`<button class="btn ${(!state.filter&&k==='all')||state.filter===k?'soft':''}" data-action="filter" data-id="${k}">${n}</button>`).join('')}<a href="#diary">写日记 →</a></div><section class="card">${records.slice().reverse().reverse().map(r=>`<div class="list-row"><div><div class="row wrap"><span class="tag">${r.kind==='diary'?'日记':'事件'}</span><span class="small muted">${r.contentDay}</span>${r.savedDay!==r.contentDay?`<span class="small muted">补记于 ${r.savedDay}</span>`:''}</div><p style="margin-top:10px">${esc(r.text.slice(0,110))}${r.text.length>110?'…':''}</p><button class="text-button" data-action="open-record" data-id="${r.id}">查看${r.kind==='diary'?'原文与回顾':'原文与结果'} →</button></div></div>`).join('')||'<p class="empty">还没有记录，先给今天留一页。</p>'}</section>`}
function diaryRecord(){return state.records.find(r=>r.kind==='diary'&&r.contentDay===state.day)}
function baseDiaryPage(){const r=state.diaryId?state.records.find(r=>r.id===state.diaryId):diaryRecord();return back('handbook')+heading('晚间日记','你的原文，和帮助你回顾的对话，分开保存。')+`<div class="stack"><section class="card"><div class="section-title"><h2>我写下的日记</h2><span class="tag ${r?'green':''}">${r?'已保存':'草稿'}</span></div><textarea id="diary-text" data-draft="${r?'diary-record@'+r.id:'diary@'+state.day}" style="min-height:190px" placeholder="今天是什么样的一天？">${esc(state.drafts[r?'diary-record@'+r.id:'diary@'+state.day]??r?.text??'')}</textarea><div class="row between mt"><span class="small muted">${r?'首次保存日 '+r.savedDay:'保存后计入今天的日记记录日'}</span><button class="btn primary" data-action="save-diary">保存日记</button></div></section><section class="card"><div class="section-title"><h2>AI 辅助回顾</h2><span class="tag blue">与原文分区</span></div><p class="muted small">已经记过的事情不反复盘问。你可以选择一个还想回看的角度。</p>${r?.reviews?.length?r.reviews.map(v=>`<div class="quote"><strong>AI 当时的问题</strong><p>${esc(v.question)}</p></div>${v.answer?`<div class="review-answer"><strong>我的回答</strong><p>${esc(v.answer)}</p></div><div class="note mt"><strong>AI 分析 · 示例</strong><p>这个片段补充了你当时获得支持的方式，可以与原文一起回看。它不会自动改写原文，也不另计一天。</p></div>`:`<label class="field">回答这个问题<textarea id="review-answer" placeholder="想起什么，就补充一点。">${esc(state.drafts['review@'+r.id]||'')}</textarea></label><button class="btn" data-action="save-review-answer">保存这段回答</button>`}`).join(''):`<button class="btn soft mt" data-action="start-review" ${!r?'disabled':''}>帮我回顾一下</button><p class="daily-note">${r?'本机预览使用固定示例问题，不发送日记。':'先保存日记，再开始辅助回顾。'}</p>`}</section></div>`}
function daysMetric(kind){const saved=[...new Set(state.records.filter(r=>r.kind===kind).map(r=>r.savedDay))].sort(),content=new Set(state.records.filter(r=>r.kind===kind).map(r=>r.contentDay));let longest=0,run=0,last=null;for(const d of saved){run=last&&shift(last,1)===d?run+1:1;longest=Math.max(run,longest);last=d}let current=0,d=saved.includes(state.day)?state.day:shift(state.day,-1);while(saved.includes(d)){current++;d=shift(d,-1)}return {total:saved.length,coverage:content.size,longest,current}}

function baseRewards(){return heading('认真生活，也安心休息。','给努力一个回应，给休息一个舒服的位置。')+subnav()+timerBanner()+`<section class="card mb"><div class="row between wrap"><div class="balance"><strong>${state.coins}</strong><span>可用金币</span></div><a class="text-button" href="#profile">我的额度与约定 →</a></div><details><summary>查看金币流水</summary>${state.ledger.map(x=>`<div class="list-row small"><div>${esc(x.title)}<small>${x.day} · ${esc(x.source)}</small></div><strong class="money ${x.amount>0?'positive':'negative'}">${x.amount>0?'+':''}${x.amount}</strong></div>`).join('')}</details></section><div class="banner"><div><strong>基础娱乐剩余 ${Math.ceil(remaining()/60)} 分钟</strong><p>${eligible()?'今天已经解锁，点开始即可使用。':'当天首次保存事件或日记后免费解锁。'}基本休息始终自由。</p></div><button class="btn" data-action="start-free" ${!eligible()||remaining()<=0?'disabled':''}>开始基础娱乐</button></div><div class="section-title"><h2>奖励商店</h2><button class="btn soft" data-action="add-product">＋ 添加想要的奖励</button></div><div class="three-col">${state.products.map(p=>`<section class="card product"><span class="icon-box">${icon(p.icon)}</span><h3>${esc(p.name)}</h3><p>${esc(p.note)}</p><div class="price">${p.price} <small>金币</small></div><div class="row wrap"><button class="btn primary" data-action="purchase" data-id="${p.id}">${p.type==='time'?'兑换并开始':'兑换奖励'}</button><button class="text-button" data-action="price" data-id="${p.id}">调整价格</button></div></section>`).join('')}</div><section class="card mt"><div class="section-title"><h2>我的奖励</h2><span class="small muted">购买和实际使用分别记录</span></div>${[...state.vouchers].reverse().map(v=>`<div class="list-row"><div><h3>${esc(v.name)} <span class="tag">${voucherLabel(v)}</span></h3><small>${v.paid} 币 · ${v.day} 兑换${v.type==='time'?' · 原始 '+Math.ceil((v.originalSeconds||v.remaining)/60)+' 分钟 · 剩余 '+timeText(v.remaining):''}</small></div><button class="btn compact" data-action="use-voucher" data-id="${v.id}" ${v.used?'disabled':''}>${v.used?'已使用':v.type==='time'?(v.remaining<(v.originalSeconds||v.remaining)? function updateClock(){if(!state.timer)return;document.querySelectorAll('[data-elapsed]').forEach(e=>e.textContent=timeText(elapsed()));const counter=$('[data-remaining]');if(counter)counter.textContent=timeText(elapsed()<=state.timer.planned?Math.ceil(state.timer.planned-elapsed()):elapsed()-state.timer.planned);const caption=$('[data-timer-caption]');if(caption)caption.textContent=elapsed()>state.timer.planned?'已超出计划时间':'剩余时间';const face=$('.timer-face');if(face)face.style.setProperty('--progress',Math.min(100,elapsed()/state.timer.planned*100)+'%')}

function startTimer(mode,id,source){if(state.timer){const same=mode==='plan'?state.timer.planId===id:source==='free'?state.timer.source==='free':state.timer.voucherId===id;if(same){go('timer');return}return pendingTimer()}let title,planned,planId,voucherId;if(mode==='plan'){const p=state.plans.find(p=>p.id===id);if(outcome(p))return toast('这个当次结果已记录。');title=p.title;planned=p.minutes*60;planId=id}else if(source==='free'){if(!eligible()||remaining()<=0)return;title='我的基础娱乐';planned=remaining()}else{const v=state.vouchers.find(v=>v.id===id);if(!v||v.used)return;title=v.name+' · '+voucherLabel(v);planned=v.remaining;voucherId=v.id}const t={id:uid(),title,mode,source,planId,voucherId,planned,seconds:0,status:'running',resumed:Date.now(),day:state.day,policy:state.profile.strict,note:''};openDialog('开始'+(mode==='plan'?'计划':'娱乐'),`<p>${esc(title)} · ${Math.ceil(planned/60)} 分钟</p><p class="note mt">${policyText(t)}</p><p class="daily-note">规则在开始时固定，之后的阶段建议不追改本次会话。</p>`,()=>{t.resumed=Date.now();state.timer=t;save();closeDialog();go('timer')},'开始计时')}

function timerResult(t=state.timer){const actual=elapsed(t),over=Math.max(0,actual-t.planned-180),rate=t.policy==='exam'?4:2,cap=t.policy==='exam'?20:10,daily=t.policy==='exam'?30:20,used=state.ledger.filter(x=>x.day===state.day&&x.source==='超时').reduce((n,x)=>n-x.amount,0),penalty=t.policy==='gentle'||t.mode==='plan'?0:Math.min(Math.floor(over/300)*rate,cap,Math.max(0,daily-used),state.coins),already=state.ledger.filter(x=>x.day===state.day&&x.source==='守时').reduce((n,x)=>n+x.amount,0),reward=t.mode==='entertainment'&&actual>=300&&actual<=t.planned+180&&already<2&&state.profile.built?1:0;return {actual,penalty,reward}}
function endTimer(){pauseTimer();const t=state.timer,c=timerResult();openDialog('核对这段时间',`<p>${esc(t.title)} · 实际 ${timeText(c.actual)}</p><div class="calc"><div><span>约定时间</span><strong>${Math.ceil(t.planned/60)} 分钟</strong></div><div><span>${t.mode==='plan'?'计划完成情况':'守时小奖励'}</span><strong>${t.mode==='plan'?'下一步记录':c.reward?'＋1 币':'无'}</strong></div>${c.penalty?`<div><span>按开始时约定的超时扣币</span><strong class="negative">−${c.penalty} 币</strong></div>`:''}</div>${c.actual>t.planned&&!c.penalty?'<p class="note">这次超过了预计时长。当前结算没有金币处罚；可以查看约定或说明实际情况。</p>':''}<button class="text-button mt" data-action="exception">时间不准确？先说明情况</button>`,()=>{const result=timerResult();if(t.mode==='entertainment'){if(t.source==='free'){const d=state.days[t.day];d.used+=Math.min(result.actual,t.planned)}else{const v=state.vouchers.find(v=>v.id===t.voucherId);v.remaining=Math.max(0,v.remaining-Math.min(result.actual,t.planned));v.used=v.remaining<1}if(result.penalty)ledger(-result.penalty,'娱乐超时 · 按事先约定','timer-penalty:'+t.id,'超时');if(result.reward)ledger(result.reward,'按约结束娱乐','timer-reward:'+t.id,'守时')}state.timers.unshift({...t,seconds:result.actual,status:'ended'});state.timer=null;save();closeDialog();if(t.mode==='plan')openPlanResult(t.planId,'done',t.id);else{go('rewards');toast('已保存这段时间与结算。')}},t.mode==='plan'?'保存计时，记录完成情况':'确认结束与结算')}

function radar(){const visibleDimensions=dimensions.filter(n=>state.dimensionVisibility[n]!=='hidden');const cx=180,cy=175,radius=115,at=(i,r)=>[cx+Math.cos(i*Math.PI*2/Math.max(1,visibleDimensions.length)-Math.PI/2)*r,cy+Math.sin(i*Math.PI*2/Math.max(1,visibleDimensions.length)-Math.PI/2)*r];return `<svg class="radar" viewBox="0 0 360 360" role="img" aria-label="13维属性雷达图">${[.25,.5,.75,1].map(f=>`<polygon points="${visibleDimensions.map((_,i)=>at(i,radius*f).join(',')).join(' ')}" fill="none" stroke="#e2e7f3"/>`).join('')}${visibleDimensions.map((_,i)=>`<line x1="${cx}" y1="${cy}" x2="${at(i,radius)[0]}" y2="${at(i,radius)[1]}" stroke="#e2e7f3"/>`).join('')}<polygon points="${visibleDimensions.map((d,i)=>at(i,radius*attributeValue(d)/100).join(',')).join(' ')}" fill="#4356df28" stroke="#4356df" stroke-width="2"/>${visibleDimensions.map((d,i)=>{const [x,y]=at(i,radius+32);return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle">${d} ${attributeValue(d)}</text>`}).join('')}</svg>`}

function recordPage(){const r=state.records.find(x=>x.id===state.activeRecord);if(!r)return back('handbook')+heading('还没有选择事件','从手账打开一条记录。');const statuses={queued:'分析中',failed:'分析失败',needsInput:'待补充',ready:'建议待确认',idle:'尚未分析'};return back(r.planId?'plans':'handbook')+heading('这一件事','原文、补充与确认依据，一起保留。')+`<section class="card mb"><div class="row between wrap"><span class="tag ${r.revoked?'orange':'green'}">${r.revoked?'已撤销':'原文已保存'}</span><span class="small muted">内容 ${r.contentDay} · 保存 ${r.savedDay} · 原文 v${r.version}</span></div><p class="detail-original mt">${esc(r.text)}</p>${r.supplement?`<p class="quote">你的补充：${esc(r.supplement)}</p>`:''}<div class="row wrap mt"><button class="btn compact" data-full="edit-event">编辑原文</button><button class="text-button" data-full="link-fact">关联同一件事</button><button class="text-button" data-full="record-audit">查看审计</button>${!r.revoked?'<button class="btn compact danger" data-full="revoke-event">撤销记录</button>':''}</div>${r.sameFactAs?'<p class="note mt">由你主动确认同一事实，两份原文保留，共享入账结果。</p>':''}</section><section class="card"><div class="section-title"><h2>分析与奖励建议</h2><span class="tag blue">${r.revoked?'不再参与新分析':r.settled?'已确认入账':statuses[r.analysisStatus]||'脚本预览'}</span></div>${r.revoked?'<p class="muted">原文与历史审计仍保留，属性不再累计；已发金币保留。</p>':r.settled?`<div class="reward-strip">${r.reused?'共享已有事实入账':r.award===undefined?'历史样例已结算':`已入账 ${r.award} 币 · ${esc(r.attribute||'属性依据当时建议')}`}</div><details><summary>查看确认时依据</summary><div class="body">${esc(r.confirmedSnapshot?.text||r.text)}<br>${esc(r.confirmedSnapshot?.attribute||r.attribute||'历史样例无新增属性')}<br>后续编辑不覆盖已经确认的依据，也不自动再次发奖。</div></details>`:r.analysisStatus==='queued'?'<p class="quote">正在生成分析示例，原文已经保存。</p><button class="btn" data-full="cancel-analysis">取消分析</button>':r.analysisStatus==='failed'?'<p class="quote">本次模拟调用失败，原文和补充仍在。</p><button class="btn primary" data-full="analyze">重试分析</button>':r.suggestion?rewardView(r):`<p class="muted small">${r.analysisIntent==='never'?'这条记录选择了只记录；你仍可主动发起分析。':'根据当前事件建议属性、金币和目标关联，不要求自己判成果档位。'}</p>${r.clarify?`<p class="quote">${esc(r.clarify)}</p><button class="btn primary" data-action="correct-record">补充这件事</button>`:'<button class="btn primary mt" data-full="analyze">现在分析（模拟）</button>'}`}${!r.settled&&!r.revoked?'<details><summary>分析状态演示</summary><label class="field">这次模拟结果<select id="analysis-demo-result"><option value="ready">正常生成建议</option><option value="needsInput">事实不足，需要补充</option><option value="failed">调用失败，保留输入</option></select></label></details>':''}<p class="daily-note">${esc(modelCaption())} · 所有分析为本机脚本示例</p></section>`}
function pending(){const records=state.records.filter(r=>r.kind==='event'&&!r.settled&&!r.revoked);return heading('待处理','原文已经保存，按自己的时间慢慢处理。')+`<section class="card">${records.map(r=>`<div class="list-row"><div><h3>${esc(r.text.slice(0,45))}</h3><small>${r.savedDay} · ${r.suggestion?'建议待确认':r.clarify?'待补充':r.analysisStatus==='failed'?'分析失败':'待分析'}</small></div><button class="btn compact" data-action="open-record" data-id="${r.id}">继续</button></div>`).join('')||'<p class="empty">目前没有待处理的事件。</p>'}</section>`}
function beginAnalysis(r){if(!r||r.settled||r.revoked)return;if(state.model.source==='off'){openDialog('AI 当前已关闭','<p>原文保留。启用个人模型后再分析，也可以一直只记录。</p>',()=>{closeDialog();go('models')},'查看模型设置');return}const mode=!['demo-chat-model','example-chat'].includes(state.model.model)?'failed':$('#analysis-demo-result')?.value||'ready',token=uid();r.analysisStatus='queued';r.analysisToken=token;save();render();setTimeout(()=>{if(r.analysisToken!==token||r.revoked)return;if(mode==='failed'){r.analysisStatus='failed';delete r.suggestion}else if(mode==='needsInput'){delete r.suggestion;r.clarify='关于这件事，你实际做了什么，或有什么具体进展？';r.analysisStatus='needsInput'}else{suggestRecord(r);r.analysisStatus=r.suggestion?'ready':'needsInput'}save();if(state.route==='record'&&state.activeRecord===r.id)render()},650)}
function contextForDiary(r){return [r.text,...state.records.filter(x=>x.id!==r.id&&x.contentDay===r.contentDay&&!x.revoked).map(x=>x.text),...state.plans.map(p=>state.outcomes[p.id+'@'+r.contentDay]?.status==='done'?p.title:'').filter(Boolean),...Object.entries(state.care).filter(([k])=>k.startsWith(r.contentDay+'@')).map(([k,v])=>k.split('@')[1]+'：'+v),...r.sessions.flatMap(s=>s.turns.map(t=>t.answer||''))].join(' ')}
function reviewCandidates(r){const context=contextForDiary(r),used=new Set(r.sessions.flatMap(s=>s.turns.map(t=>t.topic)));const questions=[];if(/沮丧|着急|难过|烦|疲惫|不开心|挫折/.test(context)&&!/开心|支持|轻松|感谢|朋友帮助/.test(context)&&!used.has('support'))questions.push({topic:'support',text:'除了已经记下的困难，今天有没有一个让你稍微轻松，或感觉被支持的片段？没有也没关系。'});if(!/睡眠|睡了|起床|几点睡/.test(context)&&!used.has('sleep'))questions.push({topic:'sleep',text:'回看这一天，睡眠和精神状态有什么想补充的吗？可以跳过。'});if(!/饮食|吃饭|三餐|早餐|午餐|晚餐/.test(context)&&!used.has('food'))questions.push({topic:'food',text:'今天吃饭和照顾自己这方面，有没有想留下一句的？'});if(!/运动|散步|跑步|训练|活动|健身/.test(context)&&!used.has('movement'))questions.push({topic:'movement',text:'今天有没有让身体活动或休息的一小段时间，想留作回顾？'});return questions}
function diarySessionHTML(r,s){return `<details class="review-session" open><summary>辅助回顾 · ${s.day} · ${s.state==='finished'?'已结束':'可继续'}</summary>${s.turns.map((t,i)=>`<div class="quote"><strong>AI 引导 ${i+1}</strong><p>${esc(t.question)}</p></div>${t.state==='asked'?`<label class="field">我的回答<textarea id="review-answer" data-review-turn="${t.id}" placeholder="想说多少都可以，也可以跳过。">${esc(state.drafts['review-turn@'+t.id]||'')}</textarea></label><div class="row wrap"><button class="btn primary" data-full="answer-review" data-id="${s.id}">保存回答，继续</button><button class="btn" data-full="skip-review" data-id="${s.id}">跳过</button><button class="text-button" data-full="finish-review" data-id="${s.id}">结束问答</button></div>`:`<div class="review-answer"><strong>我的回答</strong><p>${t.state==='skipped'?'已跳过':esc(t.answer)}</p></div>`}`).join('')}${s.analysis?`<div class="note mt"><strong>AI 辅助分析 · 示例</strong><p>${esc(s.analysis)}</p></div>`:''}<details><summary>查看当时参考的日记与事件</summary><p class="small muted">日记原文 v${s.snapshot.version} · 来源 ${s.snapshot.sources.length} 条</p><p class="detail-original">${esc(s.snapshot.text)}</p>${s.snapshot.sources.map(x=>`<p class="small muted">${esc(x.text)}</p>`).join('')}</details></details>`}
function diaryPage(){const r=state.diaryId?state.records.find(x=>x.id===state.diaryId):diaryRecord(),draftKey=r?'diary-record@'+r.id:'diary@'+state.day,active=r?.sessions.find(s=>s.state==='active');return back('handbook')+heading('晚间日记','我的原文、AI 的引导、我的回答和辅助分析，分别保留。')+`<div class="two-col"><div class="stack"><section class="card"><div class="section-title"><h2>我写下的日记</h2><span class="tag ${r?'green':''}">${r?'已保存 · v'+r.version:'本机草稿'}</span></div><textarea id="diary-text" data-draft="${draftKey}" style="min-height:210px">${esc(state.drafts[draftKey]??r?.text??'')}</textarea><div class="row between wrap mt"><span class="small muted">${r?'首次保存日 '+r.savedDay:'保存后计入日记记录日'}</span><button class="btn primary" data-full="save-diary">保存日记</button></div></section><section class="card"><div class="section-title"><h2>AI 辅助回顾</h2><span class="tag blue">与原文分开</span></div><p class="small muted">优先避开已在日记、事件、计划和之前问答中覆盖的内容。所有问题和回答保留，原文不被自动改写。</p>${r?.sessions.length?r.sessions.map(s=>diarySessionHTML(r,s)).join(''):''}${!active?`<button class="btn soft mt" data-full="start-review" ${!r?'disabled':''}>${r?.sessions.length?'再回顾一下':'帮我回顾一下'}</button>`:''}${!r?'<p class="daily-note">先保存日记，再开始辅助回顾。</p>':''}</section></div><aside class="card"><h3>当天已经记录的</h3>${state.records.filter(x=>x.id!==r?.id&&x.contentDay===(r?.contentDay||state.day)&&!x.revoked).map(x=>`<p class="quote">${esc(x.text)}</p>`).join('')||'<p class="empty">当天事件会出现在这里，无需抄进日记。</p>'}<a href="#today" class="text-button">返回今天，记一件事 →</a></aside></div>`}
function startReview(){const r=state.records.find(x=>x.id===state.diaryId)||diaryRecord();if(!r)return;if(reviewModel().source==='off'||!['demo-chat-model','example-chat'].includes(reviewModel().model))return toast('辅助模型当前不可用；日记原文已保存，可先到模型设置核对。');const existing=r.sessions.find(s=>s.state==='active');if(existing)return render();const candidates=reviewCandidates(r);if(!candidates.length)return toast('已记录的内容比较完整，这次没有新的示例问题。');const q=candidates[0];r.sessions.push({id:uid(),day:state.day,state:'active',turns:[{id:uid(),topic:q.topic,question:q.text,answer:'',state:'asked'}],snapshot:{text:r.text,version:r.version,sources:state.records.filter(x=>x.id!==r.id&&x.contentDay===r.contentDay&&!x.revoked).map(x=>({id:x.id,text:x.text,version:x.version}))}});state.diaryId=r.id;save();render()}
function finishReview(r,s){s.state='finished';s.analysis='这份回顾结合你当时的原文与回答，保留了当天的行动和感受。可以从一个自己愿意继续的小安排开始，不要求把每一天过得完美。';s.endedAt=new Date().toISOString();save();render()}
function saveFullDiary(){const text=$('#diary-text').value.trim();if(!text)return toast('先写一点想留下的内容。');let r=state.diaryId?state.records.find(x=>x.id===state.diaryId):diaryRecord();if(r){if(r.text!==text){(r.revisions ||= []).push({version:r.version,text:r.text});r.text=text;r.version++}}else{r=addRecord(text,'diary');r.version=1;r.sessions=[]}state.diaryId=r.id;delete state.drafts['diary@'+state.day];delete state.drafts['diary-record@'+r.id];save();render();toast('日记原文已保存，辅助问答保持独立。')}

function exportPage(){const o=exportDraft;return back('my')+heading('导出与本地保存','选择原文、完整辅助记录或游戏存档。')+`<div class="two-col"><section class="card"><label class="field">文件格式<select id="export-format">${[['markdown','Markdown · 阅读与整理'],['html','HTML · 浏览器离线阅读'],['json','JSON · 完整业务存档'],['csv','CSV · 原文表格']].map(([v,n])=>`<option value="${v}" ${o.format===v?'selected':''}>${n}</option>`).join('')}</select></label><label class="field">记录范围<select id="export-kind">${[['all','事件与日记'],['event','只导出事件'],['diary','只导出日记']].map(([v,n])=>`<option value="${v}" ${o.kind===v?'selected':''}>${n}</option>`).join('')}</select></label><div class="form-grid"><label class="field">开始日期<input id="export-start" type="date" value="${o.start}"></label><label class="field">结束日期<input id="export-end" type="date" value="${o.end}"></label></div><label class="check-option"><input id="export-ai" type="checkbox" ${o.ai?'checked':''}>包含 AI 问题、我的回答与分析</label><label class="check-option"><input id="export-game" type="checkbox" ${o.game?'checked':''} ${o.format!=='json'?'disabled':''}>包含金币、属性、计划、成就、奖励券（JSON）</label><div class="row wrap mt"><button class="btn" data-full="preview-export">预览内容</button><button class="btn primary" data-full="download-export">下载文件</button></div><p id="export-error" class="error"></p></section><section class="card"><h2>这份文件里有什么？</h2><p class="quote">日记原文、AI 引导问题、你的回答、辅助分析分别标注，不把 AI 内容冒充原文。</p><p class="small muted">Markdown / HTML 适合本地阅读；JSON 保存结构化业务数据；CSV 适合表格查看。不会导出密钥、密码或管理员用户列表。</p><p class="note mt">导出不等于已支持恢复导入。旧真实数据迁移仍单独办理。</p></section></div><pre id="export-preview" class="export-preview card mt" hidden></pre>`}

function makeExport(o){if(!o.start||!o.end||o.start>o.end)throw Error('请选择有效的开始和结束日期。');const rows=state.records.filter(r=>r.contentDay>=o.start&&r.contentDay<=o.end&&(o.kind==='all'||r.kind===o.kind)).map(r=>({id:r.id,type:r.kind,savedDay:r.savedDay,contentDay:r.contentDay,original:r.text,version:r.version,revoked:!!r.revoked,...(o.ai?{supplement:r.supplement||'',eventAnalysis:r.confirmedSnapshot||r.suggestion||null,reviewSessions:r.sessions}:{} )}));const game={coins:state.coins,ledger:state.ledger,attributes:Object.fromEntries(dimensions.map(n=>[n,attributeValue(n)])),goals:state.goals,plans:state.plans,outcomes:state.outcomes,achievements:state.claims,products:state.products,vouchers:state.vouchers,timers:state.timers,challenges:state.challenges};const transcript=r=>r.reviewSessions?.map(s=>s.turns.map(t=>'AI 问题：'+t.question+'\n我的回答：'+(t.state==='skipped'?'已跳过':t.answer||'尚未回答')).join('\n\n')+(s.analysis?'\nAI 辅助分析：'+s.analysis:'')).join('\n\n')||'';if(o.format==='json')return {name:'LifeXP-本地存档.json',mime:'application/json;charset=utf-8',text:JSON.stringify({schema:'lifexp-demo-v1',exportedDay:state.day,records:rows,...(o.game?{game}:{})},null,2)};if(o.format==='html')return {name:'LifeXP-离线日记.html',mime:'text/html;charset=utf-8',text:'<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>LifeXP 离线记录</title><style>body{max-width:760px;margin:36px auto;padding:24px;font:16px/1.9 sans-serif;color:#273249}pre{white-space:pre-wrap;overflow-wrap:anywhere}article{border-bottom:1px solid #ddd;padding:20px 0}</style><h1>我的 LifeXP 记录</h1>'+rows.map(r=>`<article><h2>${r.contentDay} · ${r.type==='diary'?'日记':'事件'}</h2><h3>我的原文</h3><pre>${esc(r.original)}</pre>${o.ai?'<h3>辅助记录</h3><pre>'+esc(transcript(r)+(r.eventAnalysis?'\n事件分析：'+JSON.stringify(r.eventAnalysis):''))+'</pre>':''}</article>`).join('')+'</html>'};if(o.format==='csv'){const cell=x=>{let t=String(x??'');if(/^[=+\-@\t\r]/.test(t))t="'"+t;return '"'+t.replaceAll('"','""')+'"'};return {name:'LifeXP-记录.csv',mime:'text/csv;charset=utf-8',text:'\uFEFF'+[['类型','内容所属日','实际保存日','我的原文',...(o.ai?['完整辅助记录']:[])],...rows.map(r=>[r.type,r.contentDay,r.savedDay,r.original,...(o.ai?[JSON.stringify({review:r.reviewSessions,event:r.eventAnalysis})]:[])])].map(a=>a.map(cell).join(',')).join('\r\n')}}return {name:'LifeXP-日记.md',mime:'text/markdown;charset=utf-8',text:'# 我的 LifeXP 记录\n\n'+rows.map(r=>`## ${r.contentDay} · ${r.type==='diary'?'日记':'事件'}\n\n### 我的原文\n\n${r.original}\n\n${o.ai?'### 辅助记录\n\n'+transcript(r)+(r.eventAnalysis?'\n\n事件分析：'+JSON.stringify(r.eventAnalysis):''):''}`).join('\n\n---\n\n')}}

document.addEventListener('click',event=>{
 const source=event.target.closest('[data-full]');
 if(!source){const button=event.target.closest('[data-action]');if(button?.dataset.action==='confirm-reward'){
   const r=state.records.find(x=>x.id===state.activeRecord);if(r&&!r.settled&&r.suggestion){r.confirmedSnapshot={text:r.text,supplement:r.supplement||'',attribute:r.suggestion.attribute,version:r.version,goalId:r.suggestion.goalId};r.settledDay=state.day;save()}
  }if(button?.dataset.action==='submit-feedback'){event.stopImmediatePropagation();const title=$('#feedback-title').value.trim(),text=$('#feedback-text').value.trim();if(!title||!text)return toast('填写标题和内容后再提交。');state.feedback.unshift({id:uid(),username:state.account.username,title,text,day:state.day,reply:''});save();render();return}if(button?.dataset.action==='care-skip'){event.stopImmediatePropagation();state.care[state.day+'@'+button.dataset.id]='今天先跳过';save();render();return}
  if(button?.dataset.action==='enter-admin'){event.stopImmediatePropagation();state.role='admin';save();go('admin');return}
  if(['price','analyze-exception','phase-advice'].includes(button?.dataset.action)&&state.model.source==='off'){event.stopImmediatePropagation();toast('AI 当前已关闭，已保存的记录和手动说明不受影响。');return}
  if(button?.dataset.action==='leave-admin'){event.stopImmediatePropagation();state.role='user';save();go('my');return}
  return
 }
 event.preventDefault();event.stopImmediatePropagation();if(source.disabled)return;const action=source.dataset.full,id=source.dataset.id;
 if(action==='dismiss-notice'){state.notice='';save();render();return}
 if(action==='dismiss-announcement'){state.dismissedNotice=state.noticeData.version;save();render();return}
 if(action==='toggle-care'){state.careVisible=!state.careVisible;save();render();return}
 if(action==='save-event'){const text=$('#event-text').value.trim(),day=$('#content-day').value,intent=$('#analysis-intent').value;if(!text)return toast('先写一点想留下的内容。');if(!day||day>state.day)return toast('请选择今天或更早的日期。');const r=addRecord(text,'event',day,{version:1,sessions:[],analysisIntent:intent});delete state.drafts['event@'+state.day];state.activeRecord=r.id;save();if(intent==='now'){go('record');beginAnalysis(r)}else{render();toast('原文已保存。')}return}
 if(action==='record-filter'){state.filter=id;state.handbookUI.page=0;save();render();return}
 if(action==='search-records'){state.handbookUI={query:$('#handbook-search').value,scope:$('#handbook-scope').value,page:0};save();render();return}
 if(action==='record-page'){state.handbookUI.page+=Number(id);save();render();return}
 if(action==='filter-day'){state.handbookUI={query:'',scope:id,page:0};state.filter='all';go('handbook');return}

 if(action==='link-fact'){const r=state.records.find(r=>r.id===state.activeRecord),others=state.records.filter(x=>x.id!==r.id&&x.kind==='event'&&!x.revoked);openDialog('由你确认同一件事',`<p class="small muted">内容相似不自动合并。只有确实描述同一次行动，才建立关联。</p><label class="field">选择已有事件<select id="same-fact"><option value="">请选择</option>${others.map(x=>`<option value="${x.id}">${x.contentDay} · ${esc(x.text.slice(0,55))}${x.settled?' · 已入账':''}</option>`).join('')}</select></label>`,()=>{const target=state.records.find(x=>x.id===$('#same-fact').value);if(!target)return failDialog('请选择一条已有事件。');if(r.settled)return failDialog('这条记录已经入账，不能直接改变历史关联。请保留说明并走复核。');if(!target.settled)return failDialog('请先确认作为来源的那条事件，再关联共享结果。');r.sameFactAs=target.id;r.reused=true;r.settled=true;r.award=target.award||0;r.attribute=target.attribute;state.audit.push({type:'同事实关联',record:r.id,target:target.id});save();closeDialog();render()},'确认同一事实');return}
