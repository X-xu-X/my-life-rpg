function recordDays(kind){
  const dates=[...new Set(state.records.filter(record=>kind==='diary'?record.kind==='diary':record.kind!=='diary').map(record=>record.date).filter(date=>date<=state.date))].sort();
  let longest=0,run=0,previous='';for(const date of dates){run=previous&&dateDifference(date,previous)===1?run+1:1;longest=Math.max(longest,run);previous=date;}
  const days=new Set(dates);let cursor=days.has(state.date)?state.date:new Date(Date.parse(state.date+'T00:00:00Z')-86400000).toISOString().slice(0,10),current=0;
  while(days.has(cursor)){current++;cursor=new Date(Date.parse(cursor+'T00:00:00Z')-86400000).toISOString().slice(0,10);}
  return {total:dates.length,current,longest};
}

function setDemoDate(date){if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(Date.parse(date+'T00:00:00Z')))return;captureDraft();saveComposerDraft();state.careDays[state.date]=state.care;state.reviewDays[state.date]=state.review;state.date=date;state.care=state.careDays[date] ||= freshCare();state.review=state.reviewDays[date] ||= freshReview();if(currentPage==='review')prepareDiary();sessionDraft=(state.recordKind==='diary'?state.diaryDrafts:state.drafts)[date]||'';aiDraft='';aiActive=false;aiDone=false;persist();render();}

function routineStartAI(){
  captureDraft();ensureReviewLog();

    const context=[...dayFacts().map(record=>record.content),state.review.note,...state.review.answers.filter(answer=>!answer.skipped).map(answer=>answer.answer),...Object.values(state.occurrences).filter(item=>item.date===state.date).map(item=>item.detail||'')].join(' ');
    questionList=[];
    if(/沮丧|失落|挫败|难过/.test(context)&&!/开心|振作|轻松|鼓励|支持|清醒/.test(context))questionList.push({kind:'balance',text:'除了写下的困难，今天有没有一个稍微轻松、得到支持或觉得有希望的瞬间？想不到也没关系，可以跳过。'});
    for(const [key,item] of Object.entries(state.care)){
      const mentioned={sleep:/睡|休息|作息/,meal:/饭|饮食|三餐/,move:/跑步|散步|拉伸|训练|运动/}[key].test(context);
      if(item.state==='missing'&&!mentioned)questionList.push({kind:key,text:{sleep:'今天的休息状态，有什么你想记一下？',meal:'今天吃饭的节奏怎么样，有没有想补充的？',move:'今天有没有活动身体，或者安排休息？'}[key]});

    if(!questionList.length){aiActive=false;aiDone=true;render();toast('已有内容已经覆盖这组示例问题，不再重复追问。');return;}
    session={id:crypto.randomUUID(),state:'active',startedAt:new Date().toISOString(),model:'本机脚本示例',snapshot:{diary:state.review.note,saved:diaryIsSaved()},queue:questionList,index:0,turns:[],analysis:null};

}

function nextQuestion(skipped){

ht">有一点实际行动</option><option value="steady" selected>有明确投入或进展</option><option value="deep">有持续投入或具体成果</option></select></label><details><summary class="small muted">切换分析演示结果</summary><select id="analysis-outcome"><option value="ready">生成建议</option><option value="needsInput">待补充</option><option value="failed">调用失败</option></select></details></div><div class="record-actions">${status==='queued'?'<button class="btn" data-suite="cancel-event">取消分析</button>':`<button class="btn ${suggestion?'':'primary'}" data-suite="analyze-event">${status==='failed'?'重试分析':status==='needsInput'?'保存补充并分析':suggestion?'重新生成示例':'现在分析'}</button>`}${suggestion?'<button class="btn primary" data-suite="confirm-event">确认入账</button>':''}</div>`:'<p class="success-box">本次实际流水已记录，再次查看不会重复入账。</p>'}<p class="subtle-note">${esc(modelCaption())} · 分析为本机脚本演示</p></section>`;

function modalError(text){const box=document.getElementById('modal-error');box.textContent=text;box.hidden=false;}
function closePreviewDialog(){document.getElementById('preview-dialog').close();pendingModal=null;}
function openRecord(id){const record=state.records.find(record=>record.id===id);if(!record)return;if(record.kind==='diary'){setDemoDate(record.date);setPage('review');}else{detailId=id;setPage('detail');}}
function analyzeRecord(){
  const record=state.records.find(record=>record.id===detailId);if(!record||record.confirmed||record.analysisStatus==='queued')return;
  if(state.preview.ai.source==='off'){showPreviewDialog('AI 目前已关闭','<p class="dashboard-quote">原文可以照常保存。需要分析时，在模型设置中主动选择一个来源。</p>',()=>{closePreviewDialog();setPage('settings');},'去模型设置');return;}
  if(state.preview.ai.status!=='ready'){showPreviewDialog('先验证模型配置','<p class="dashboard-quote">配置已经保存，但还没有通过示例测试。先验证，再发起分析。</p>',()=>{closePreviewDialog();setPage('settings');},'去验证');return;}
  const supplement=document.getElementById('event-supplement')?.value.trim();if(supplement){record.supplement=supplement;record.version=(record.version||1)+1;}
  record.analysisIntent='now';record.goalId=document.getElementById('event-goal').value;const grade=document.getElementById('event-grade').value,outcome=document.getElementById('analysis-outcome')?.value||'ready';
  record.analysisStatus='queued';record.suggestion=null;const version=record.version||1;persist();render();
  setTimeout(()=>{if(record.version!==version||record.analysisStatus!=='queued')return;record.analysisStatus=outcome;if(outcome==='ready'){const goal=state.preview.goals.find(goal=>goal.id===record.goalId),bonus=goal?.main?{light:1,steady:3,deep:5}[grade]:0;record.suggestion={attribute:'智力',delta:{light:.2,steady:.5,deep:.8}[grade],grade:{light:'轻量行动',steady:'明确投入／进展',deep:'持续投入／具体成果'}[grade],bonus,coins:2+bonus,reason:'针对这次记录中的实际行动，展示一份独立建议。需要补充时只围绕这件事追问。',version};}persist();if(currentPage==='detail'&&detailId===record.id)render();},450);
}
function confirmRecord(){const record=state.records.find(record=>record.id===detailId);if(!record?.suggestion||record.confirmed)return;if(!state.preview.neutral){showPreviewDialog('先选择游戏起点','<p class="dashboard-quote">原文和建议已经保留。你之前选择先使用未评估基线，之后再迁入旧数据。</p>',()=>{state.preview.neutral=true;persist();closePreviewDialog();render();},'使用未评估基线');return;}
  const canonical=record.sameFactAs||record.id;if(state.preview.coinLedger.some(row=>row.ref===canonical)||state.ledger.some(row=>row.recordId===canonical)){record.confirmed=true;record.reusedSettlement=true;record.analysisStatus='confirmed';persist();render();return;}
  record.confirmed=true;record.analysisStatus='confirmed';state.preview.coinLedger.push({id:'event-'+canonical,ref:canonical,amount:record.suggestion.coins,title:record.title,source:'事件确认 · 示例'});persist();render();}
function previewChecklist(){return heading('审阅这一版','先体验，再决定要把哪些方案交给 Writer。','完整体验 Demo · 待你确认')+`<div class="proposal-note">这不是正式应用。所有账号、模型、邮件、分析和奖励都是本机示例；不要填写真实密码或 Key。你确认后才定稿开发文档，不会从这里自动启动 Writer。</div><section class="card"><h2>先走一遍日常路径</h2><div class="demo-grid" style="margin-top:18px">${previewDirectory().map(([page,title,desc])=>`<button data-nav="${page}">${title}<small>${desc}</small></button>`).join('')}</div></section><section class="card" style="margin-top:20px"><div class="section-head"><h2>本版体验意见</h2><button class="link-btn" data-suite="download-feedback">下载意见记录</button></div><p class="small muted">选项只存本机，最终确认仍请在聊天里告诉我。候选不等于已经批准实施。</p>${decisionItems.map(([id,title,desc,status])=>`<article class="approval-item"><div class="row between"><h3>${title}</h3><span class="${status==='候选'?'candidate':'badge gray'}">${status}</span></div><p>${desc}</p><div class="approval-options">${['接受这版','需要调整','暂缓'].map(choice=>`<button data-decision="${id}" data-choice-value="${choice}" aria-pressed="${state.preview.decisions[id]===choice}">${choice}</button>`).join('')}</div></article>`).join('')}<div class="form-grid"><label>还想调整的地方<textarea id="preview-feedback" placeholder="可以写页面、按钮或一段操作路径。">${esc(state.preview.feedback)}</textarea></label><button class="btn primary" data-suite="save-feedback">保存本机意见</button></div></section><section class="card" style="margin-top:20px"><h2>切换体验身份</h2><p class="dashboard-quote">普通日常账号与管理身份分开体验。这里只改变虚构预览身份，不是实际授权机制。</p><div class="row wrap"><button class="btn ${state.preview.role==='user'?'primary':''}" data-role="user">日常账号</button><button class="btn ${state.preview.role==='admin'?'primary':''}" data-role="admin">管理身份</button></div><p class="subtle-note">App／微信小程序、旧数据迁移和公网部署属于后续工作，本版不承诺已完成。</p></section>`;}
function render(){
  if(!state.preview)return;if(state.preview.role==='admin'&&!['admin','admin-users','admin-notices','admin-site','admin-audit','admin-account','preview'].includes(currentPage))currentPage='admin';if(state.preview.role!=='admin'&&currentPage.startsWith('admin'))currentPage='admin';nav();document.getElementById('demo-date').value=state.date;
  const pages={today,handbook,detail:eventDetail,plans:planOverview,goals:goalsPage,review,growth,my:myPage,settings:modelSettings,security:securityPage,export:exportPage,admin:adminPage,'admin-users':adminUsersPage,'admin-notices':adminNoticesPage,'admin-site':adminSitePage,'admin-audit':adminAuditPage,'admin-account':adminAccountPage,auth:authPage,preview:previewChecklist,guide};
  document.getElementById('app').innerHTML=(pages[currentPage]||today)();
  if(currentPage==='handbook')document.getElementById('handbook-scope').value=handbookScope;
  if(currentPage==='export')document.getElementById('export-kind').value=exportOptions.kind;
  if(currentPage==='today'){
    const composer=document.querySelector('.composer-foot');if(composer)composer.insertAdjacentHTML('beforebegin',`<div class="row wrap" style="margin:0 0 16px"><label class="small muted" for="save-intent">保存后</label><select id="save-intent" class="btn small-btn"><option value="later">先保存，稍后分析</option><option value="now">现在分析</option><option value="never">只记录，不分析</option></select><details class="small muted"><summary>补记其他日期</summary><input type="date" id="event-date" value="${state.date}" style="max-width:180px;margin-top:8px"></details></div>`);
  }
}
function handlePreviewAction(action){
  if(action==='close-modal'){closePreviewDialog();return;}
  if(action==='confirm-modal'){pendingModal?.();return;}
  if(action==='dismiss-notice'){state.preview.noticeDismissed=state.preview.notice.version;persist();render();return;}
  if(action==='search'){handbookQuery=document.getElementById('handbook-search').value.trim();handbookScope=document.getElementById('handbook-scope').value;handbookPage=0;render();return;}
  if(action==='neutral'){state.preview.neutral=true;persist();render();return;}
  if(action==='analyze-event'){analyzeRecord();return;}
  if(action==='cancel-event'){const record=state.records.find(record=>record.id===detailId);record.analysisStatus='idle';persist();render();return;}
  if(action==='confirm-event'){confirmRecord();return;}
  if(action==='edit-event'){const record=state.records.find(record=>record.id===detailId);showPreviewDialog('编辑事件原文',`<div class="form-grid"><label>原文<textarea id="edit-event-text">${esc(record.content)}</textarea></label></div><p class="subtle-note">原文变动后，旧的未确认建议会失效。已入账更正需另走正式冲正流程。</p>`,()=>{const text=document.getElementById('edit-event-text').value.trim();if(!text){modalError('原文不能为空。');return;}if(record.confirmed){modalError('这条已入账。正式更正与冲正流程仍待确认，本版不直接改账。');return;}record.content=text;record.title=text.slice(0,30);record.version=(record.version||1)+1;record.analysisStatus='idle';record.suggestion=null;persist();closePreviewDialog();render();},'保存原文');return;}
  if(action==='related'){const candidates=state.records.filter(record=>record.kind!=='diary'&&record.id!==detailId);showPreviewDialog('疑似关联 · 交互示例',`<p class="dashboard-quote">AI 只能建议关联，由你决定。这里列出示例原文，不代表已做语义检测。</p><div class="form-grid"><label>选择同一次行动的原文<select id="related-record"><option value="">不关联，保持独立</option>${candidates.map(record=>`<option value="${record.id}">${esc(record.title)}</option>`).join('')}</select></label></div><p class="subtle-note">两份原文保留；同一实际行动不重复计奖。</p>`,()=>{const record=state.records.find(record=>record.id===detailId);if(record.confirmed){modalError('已入账记录不能通过关联改写旧账。');return;}record.sameFactAs=document.getElementById('related-record').value||null;persist();closePreviewDialog();render();},'确认关联');return;}
  if(action==='add-goal'){const name=document.getElementById('goal-name').value.trim();if(!name){toast('先写下目标名称。');return;}state.preview.goals.push({id:crypto.randomUUID(),name,note:document.getElementById('goal-note').value.trim(),main:false});persist();render();return;}
  if(action==='claim-achievement'){if(state.preview.claimed.includes('first-project'))return;state.preview.claimed.push('first-project');state.preview.coinLedger.push({id:'achievement-first-project',amount:10,title:'第一次完成云端部署',source:'成就奖励 · 示例'});persist();render();return;}
  if(action==='ignore-achievement'){toast('可以稍后再决定，这次不发放奖励。');return;}
  if(action==='accept-challenge'){state.preview.challenge={accepted:true,claimed:false};persist();render();return;}
  if(action==='claim-challenge'){const challenge=state.preview.challenge;if(!challenge||challenge.claimed||learningProgress()<2)return;challenge.claimed=true;state.preview.coinLedger.push({id:'challenge-2',amount:12,title:'完成两次有成果的复习',source:'挑战奖励 · 示例'});persist();render();return;}
  if(action==='add-product'){showProductForm();return;}
  if(action==='save-feedback'){state.preview.feedback=document.getElementById('preview-feedback').value;persist();toast('意见已存本机，请在聊天里告诉我最终决定。');return;}
  if(action==='download-feedback'){downloadArtifact({name:'LifeXP-Demo-意见.json',type:'application/json',text:JSON.stringify({scope:'本机候选意见，不是 Writer 开工指令',choices:state.preview.decisions,feedback:state.preview.feedback},null,2)});return;}
  handleSettingsAction(action);
}
document.addEventListener('click',event=>{
  const button=event.target.closest('button');if(!button)return;
  if(button.id==='create-plan'){
    event.stopImmediatePropagation();const before=state.plans.length;createPlan();if(state.plans.length===before)return;
    const plan=state.plans.at(-1);if(plan.goal){let goal=state.preview.goals.find(goal=>goal.name===plan.goal);if(!goal){goal={id:crypto.randomUUID(),name:plan.goal,note:'来自你主动设置的计划',main:false};state.preview.goals.push(goal);}if(plan.main){for(const candidate of state.preview.goals)candidate.main=candidate===goal;for(const candidate of state.plans)candidate.main=candidate.goal===goal.name;}}persist();render();return;
  }
  if(button.id==='save-event'){
    event.stopImmediatePropagation();captureDraft();const text=document.getElementById('event-input').value.trim();if(!text){toast('先写一点想留下的内容。');return;}
    const date=document.getElementById('event-date')?.value||state.date,intent=document.getElementById('save-intent').value;
    const record={id:'event-'+crypto.randomUUID(),kind:'event',date,time:'刚刚',title:text.slice(0,30)+(text.length>30?'…':''),content:text,version:1,analysisIntent:intent,analysisStatus:'idle'};state.records.unshift(record);sessionDraft='';saveComposerDraft();persist();
    if(intent==='now'){detailId=record.id;setPage('detail');analyzeRecord();}else{render();toast('事件原文已保存在本机预览。');}return;
  }
  if(button.dataset.suite){event.stopImmediatePropagation();handlePreviewAction(button.dataset.suite);return;}
  if(button.dataset.openRecord){event.stopImmediatePropagation();openRecord(button.dataset.openRecord);return;}
  if(button.dataset.growth){event.stopImmediatePropagation();growthTab=button.dataset.growth;setPage('growth');return;}
  if(button.dataset.handbook){event.stopImmediatePropagation();handbookKind=button.dataset.handbook;handbookPage=0;render();return;}
  if(button.dataset.pageStep){event.stopImmediatePropagation();handbookPage+=Number(button.dataset.pageStep);render();return;}
  if(button.dataset.mainGoal){event.stopImmediatePropagation();const goal=state.preview.goals.find(goal=>goal.id===button.dataset.mainGoal);for(const candidate of state.preview.goals)candidate.main=candidate===goal;for(const plan of state.plans)plan.main=plan.goal===goal.name;persist();render();return;}
  if(button.dataset.redeem){event.stopImmediatePropagation();const product=state.preview.products.find(product=>product.id===button.dataset.redeem),redemptionId=crypto.randomUUID();showPreviewDialog('兑换这个奖励？',`<h3 style="margin-top:17px">${esc(product.name)}</h3><div class="info-line"><span>本次消耗</span><strong class="money">${product.coins} 币</strong></div><div class="info-line"><span>兑换后余额</span><strong class="money">${balance()-product.coins} 币</strong></div><p class="subtle-note">确认后生成一张待兑现奖励券，真正享用时再标记。</p>`,()=>{if(state.preview.vouchers.some(voucher=>voucher.id===redemptionId))return;if(balance()<product.coins){modalError('金币不足，未扣除。');return;}state.preview.vouchers.push({id:redemptionId,name:product.name,coins:product.coins,used:false});state.preview.coinLedger.push({id:redemptionId,amount:-product.coins,title:'兑换「'+product.name+'」',source:'奖励券 · 示例'});persist();closePreviewDialog();render();},'确认兑换');return;}
  if(button.dataset.price){event.stopImmediatePropagation();showProductForm(button.dataset.price);return;}
  if(button.dataset.useVoucher){event.stopImmediatePropagation();const voucher=state.preview.vouchers.find(voucher=>voucher.id===button.dataset.useVoucher);if(voucher)voucher.used=true;persist();render();return;}
  if(button.dataset.decision){event.stopImmediatePropagation();state.preview.feedback=document.getElementById('preview-feedback').value;state.preview.decisions[button.dataset.decision]=button.dataset.choiceValue;persist();render();return;}
  if(button.dataset.role){event.stopImmediatePropagation();const feedback=document.getElementById('preview-feedback');if(feedback)state.preview.feedback=feedback.value;adminAccountOrigin=null;state.preview.role=button.dataset.role;persist();setPage(state.preview.role==='admin'?'admin':'today');return;}
  if(button.dataset.authTab){event.stopImmediatePropagation();authTab=button.dataset.authTab;if(button.dataset.nav)setPage(button.dataset.nav);else render();return;}
},true);
function startAI(){if(state.preview.ai.source==='off'||state.preview.ai.status!=='ready'){showPreviewDialog('选择可用的 AI 来源','<p class="dashboard-quote">日记原文已保留，需要辅助回顾时先启用并验证模型。</p>',()=>{closePreviewDialog();setPage('settings');},'去模型设置');return;}routineStartAI();}
function confirmPlan(id){
  const plan=state.plans.find(plan=>plan.id===id),item=plan&&state.occurrences[occurrenceKey(plan)];if(!item?.suggestion||item.settled)return;
  const record=state.records.find(record=>record.id===item.recordId),canonical=record?.sameFactAs||item.recordId;
  if(state.preview.coinLedger.some(row=>row.ref===canonical)||state.ledger.some(row=>row.recordId===canonical)){
    item.settled=true;item.resultConfirmed=true;item.reusedSettlement=true;persist();render();return;
  }
  routineConfirmPlan(id);
}
function plannedRow(plan){const item=state.occurrences[occurrenceKey(plan)];if(item?.reusedSettlement)return `<article class="plan-row"><div class="row between"><h3>${esc(plan.name)}</h3><span class="badge green">已关联原入账</span></div><p class="plan-meta">${esc(plan.goal||'独立计划')}</p><p class="small muted">同一次实际行动，不重复发放属性与金币。</p></article>`;return routinePlannedRow(plan);}

s="row wrap"><button class="btn primary" data-suite="save-model">保存配置</button><button class="btn" data-suite="test-model" ${config.status==='testing'?'disabled':''}>${config.status==='testing'?'示例测试中…':'测试已保存配置'}</button></div><div id="model-error" class="error-box" role="alert" hidden></div><div id="model-success" class="success-box" role="status" hidden></div><button class="link-btn" data-suite="valid-model-example">填入一组可通过的示例</button></div>`:`<h2>${config.source==='off'?'记录由你自己掌握':'开箱即用的候选体验'}</h2><p class="dashboard-quote">${config.source==='off'?'需要 AI 时，再主动选择模型来源。已有原文与历史分析不会删除。':'可以先尝试站点提供的模型，不必把 API 配置当成写日记的前提。'}</p><ul class="guidance-list"><li>日记原文、你的回答与 AI 分析分开展示。</li><li>不自动分析所有历史内容。</li><li>免费项失效时保留原文，允许稍后再试。</li></ul><div class="record-actions"><button class="btn soft" data-nav="review">去晚间日记看看</button></div>`}</section></div>`;}
function modelMessage(kind,text){const target=document.getElementById(kind==='error'?'model-error':'model-success');if(!target)return;document.getElementById(kind==='error'?'model-success':'model-error').hidden=true;target.textContent=text;target.hidden=false;}

function authPage(){const register=authTab==='register',forgot=authTab==='forgot';return `<section class="card auth-card"><p class="eyebrow">游戏人生 · LifeXP</p><h1>${forgot?'找回密码':register?'给自己留一页':'欢迎回来'}</h1><p>${forgot?'使用已验证邮箱恢复账号。':register?'先创建账号，模型可以以后再配。':'记录小事，慢慢看见自己的积累。'}</p><div class="auth-demo">候选流程演示，不发送邮件、不创建真实账号。请使用示例值，不填写真实密码。</div><div class="form-grid">${forgot?'<label>已验证邮箱<input id="auth-email" type="email" value="friend@example.com"></label>':`${register?'<label>用户名<input id="auth-username" value="preview_friend" maxlength="30"></label><label>邮箱<input id="auth-email" type="email" value="friend@example.com"></label>':'<label>用户名或邮箱<input id="auth-username" value="xiaolin"></label>'}<label>示例密码<input id="auth-password" type="password" value="demo-password-123" autocomplete="off"></label>${register?'<label>确认示例密码<input id="auth-password-confirm" type="password" value="demo-password-123" autocomplete="off"></label>':''}`}<button class="btn primary full" data-suite="auth-submit">${forgot?'模拟发送重设链接':register?'体验注册':'使用示例账号进入'}</button><div id="auth-error" class="error-box" hidden></div></div><div class="auth-footer">${!forgot?`<button class="link-btn" data-auth-tab="${register?'login':'register'}">${register?'已有账号，去登录':'创建账号'}</button><button class="link-btn" data-auth-tab="forgot">忘记密码</button>`:'<button class="link-btn" data-auth-tab="login">返回登录</button>'}<button class="link-btn" data-nav="preview">返回体验目录</button></div><p class="subtle-note">注册无需邀请码。手机、QQ 或微信绑定暂不作为已选定功能。</p></section>`;}
function exportPage(){return `<button class="link-btn" data-nav="my">← 返回我的</button>`+heading('导出与本地保存','选好内容，留一份自己能打开的记录。')+candidateNote('格式与默认范围供你体验选择。这些文件只含虚构示例，不是服务器备份或正式迁移包。')+`<div class="suite-grid"><section class="card"><h2>选择导出内容</h2><div class="form-grid"><label>文件格式<select id="export-format"><option value="markdown" ${exportOptions.format==='markdown'?'selected':''}>Markdown · 本地阅读和整理</option><option value="html" ${exportOptions.format==='html'?'selected':''}>HTML · 浏览器离线阅读</option><option value="json" ${exportOptions.format==='json'?'selected':''}>JSON · 完整业务存档</option><option value="csv" ${exportOptions.format==='csv'?'selected':''}>CSV · 原文表格</option></select></label><label>记录范围<select id="export-kind"><option value="all">事件与日记</option><option value="event">只导出事件</option><option value="diary">只导出日记</option></select></label><div class="suite-grid"><label>开始日期<input id="export-start" type="date" value="${exportOptions.start}"></label><label>结束日期<input id="export-end" type="date" value="${exportOptions.end}"></label></div><label class="checkbox-label"><input id="export-ai" type="checkbox" ${exportOptions.ai?'checked':''}>包含完整 AI 问答与分析</label><label class="checkbox-label"><input id="export-game" type="checkbox" ${exportOptions.game?'checked':''} ${exportOptions.format!=='json'?'disabled':''}>包含金币、属性、成就与奖励券（JSON）</label><div class="row wrap"><button class="btn" data-suite="export-preview">预览内容</button><button class="btn primary" data-suite="export-download">下载示例文件</button></div><div id="export-error" class="error-box" hidden></div></div></section><section class="card"><h2>这份文件里有什么？</h2><p class="dashboard-quote">阅读用的文件可以只保留原文。勾选 AI 后，问题、你的回答和分析分别标注，不混入日记正文。</p><div class="info-line"><span>Markdown / HTML</span><span>按日期阅读原文</span></div><div class="info-line"><span>JSON</span><span>结构化记录与可选游戏数据</span></div><div class="info-line"><span>CSV</span><span>原文及可选辅助记录列</span></div><p class="subtle-note">不包含 API Key、密码、会话凭据。导出不等于已实现反向导入。</p><pre id="export-content" class="export-preview" hidden></pre></section></div>`;}
function publicSession(session){return {startedAt:session.startedAt,endedAt:session.endedAt||null,model:session.model,state:session.state,diarySnapshot:session.snapshot?.diary||null,turns:session.turns.map(turn=>({questionId:turn.id,question:turn.question,askedAt:turn.askedAt,state:turn.state,answer:turn.answer,answeredAt:turn.answeredAt})),analysis:session.analysis};}
function buildExport(options=exportOptions){
  const records=state.records.filter(record=>record.date>=options.start&&record.date<=options.end&&(options.kind==='all'||(options.kind==='diary'?record.kind==='diary':record.kind!=='diary'))).sort((a,b)=>a.date.localeCompare(b.date));
  const rows=records.map(record=>({id:record.id,date:record.date,time:record.time,type:record.kind==='diary'?'diary':'event',title:record.title,original:record.content,supplement:record.supplement||'',...options.ai?{review:(state.reviewDays[record.date]?.sessions||[]).filter(()=>record.kind==='diary').map(publicSession),eventAnalysis:record.kind!=='diary'?record.suggestion||null:null}:{}}));
  const archive={scope:'LifeXP 本机虚构 Demo',exportedAt:new Date().toISOString(),records:rows,...options.game&&options.format==='json'?{game:{attributes:Object.fromEntries(dimensions.map(name=>[name,attributeValue(name)])),coinBalance:balance(),coinLedger:walletRows(),achievements:state.preview.claimed,rewardVouchers:state.preview.vouchers,goals:state.preview.goals,plans:state.plans}}:{}};
  const transcript=row=>(row.review||[]).map(session=>`\n### AI 辅助回顾 · ${session.startedAt||'历史示例'}\n${session.turns.map(turn=>`\n**AI 提问：** ${turn.question}\n\n**我的回答：** ${turn.state==='skipped'?'已跳过':turn.state==='asked'?'尚未回答':turn.answer}\n`).join('')}${session.analysis?'\n**AI 分析（示例）：** '+session.analysis.text+'\n':''}`).join('')+(row.eventAnalysis?`\n### AI 事件分析（示例）\n\n${row.eventAnalysis.reason}\n\n属性建议：${row.eventAnalysis.attribute} +${row.eventAnalysis.delta}；金币建议：${row.eventAnalysis.coins} 币（示例）。\n`:'');
  const markdown='# LifeXP · 我的记录\n\n虚构 Demo 导出\n'+rows.map(row=>`\n## ${row.date} · ${row.type==='diary'?'日记':'事件'}\n\n### ${row.title}\n\n**我的原文**\n\n${row.original}\n${row.supplement?'\n**我的补充**\n\n'+row.supplement+'\n':''}${options.ai?transcript(row):''}`).join('');
  if(options.format==='json')return {name:'LifeXP-示例存档.json',type:'application/json;charset=utf-8',text:JSON.stringify(archive,null,2)};
  if(options.format==='csv'){const cell=value=>{let text=String(value??'');if(/^[=+\-@\t\r]/.test(text))text="'"+text;return '"'+text.replaceAll('"','""')+'"';};return {name:'LifeXP-示例原文.csv',type:'text/csv;charset=utf-8',text:'\uFEFF'+[['类型','日期','标题','我的原文','我的补充',...(options.ai?['辅助回顾问答与分析']:[])],...rows.map(row=>[row.type,row.date,row.title,row.original,row.supplement,...(options.ai?[JSON.stringify({review:row.review,eventAnalysis:row.eventAnalysis})]:[])])].map(row=>row.map(cell).join(',')).join('\r\n')};}
  if(options.format==='html')return {name:'LifeXP-示例日记.html',type:'text/html;charset=utf-8',text:'<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>LifeXP · 本地记录</title><style>body{max-width:760px;margin:40px auto;padding:24px;font:16px/1.9 sans-serif;color:#293047}pre{white-space:pre-wrap;overflow-wrap:anywhere}article{border-bottom:1px solid #ddd;padding:20px 0}</style><h1>LifeXP · 本地记录</h1><p>虚构 Demo 导出</p>'+rows.map(row=>`<article><p>${esc(row.date)} · ${row.type==='diary'?'日记':'事件'}</p><h2>${esc(row.title)}</h2><h3>我的原文</h3><pre>${esc(row.original)}</pre>${row.supplement?'<h3>我的补充</h3><pre>'+esc(row.supplement)+'</pre>':''}${options.ai?'<pre>'+esc(transcript(row))+'</pre>':''}</article>`).join('')+'</html>'};
  return {name:'LifeXP-示例日记.md',type:'text/markdown;charset=utf-8',text:markdown};
}
function readExportForm(){exportOptions={format:document.getElementById('export-format').value,kind:document.getElementById('export-kind').value,start:document.getElementById('export-start').value,end:document.getElementById('export-end').value,ai:document.getElementById('export-ai').checked,game:document.getElementById('export-game').checked};if(!exportOptions.start||!exportOptions.end||exportOptions.start>exportOptions.end){const box=document.getElementById('export-error');box.textContent='请选择有效的起止日期。';box.hidden=false;return false;}return true;}
function downloadArtifact(artifact){const url=URL.createObjectURL(new Blob([artifact.text],{type:artifact.type})),link=document.createElement('a');link.href=url;link.download=artifact.name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function legacyAdminPage(){if(state.preview.role!=='admin')return heading('管理入口','日常账号不显示管理功能。')+`<section class="card"><p class="dashboard-quote">你现在体验的是普通日常账号。要查看候选管理界面，可到审阅页切换虚构管理身份。</p><button class="btn" data-nav="preview">切换体验身份</button></section>`;const notice=state.preview.notice;return heading('管理后台','管理身份用于站点事务，日常记录使用自己的账号。')+candidateNote('首批管理范围尚未确认。这里不展示其他人的日记、密钥或改账入口。')+`<div class="suite-grid"><section class="card"><div class="section-head"><h2>站点公告</h2><span class="badge ${notice.published?'green':'gray'}">${notice.published?'示例已发布':'未发布'}</span></div><div class="form-grid"><label>标题<input id="notice-title" value="${esc(notice.title)}" maxlength="100"></label><label>公告内容<textarea id="notice-body" maxlength="2000">${esc(notice.body)}</textarea></label><div class="row wrap"><button class="btn" data-suite="preview-notice">预览</button><button class="btn primary" data-suite="publish-notice">发布到本机示例</button><button class="btn quiet" data-suite="withdraw-notice">撤下</button></div></div></section><section class="card"><h2>注册与账号状态</h2><div class="info-line"><span>开放注册 · 候选</span><button class="toggle" data-suite="toggle-registration" role="switch" aria-checked="${state.preview.registrationOpen}" aria-label="开放注册"></button></div><div class="info-line"><div><strong>preview_friend</strong><p class="small muted">普通示例账号</p></div><button class="btn small-btn" data-suite="pause-account">${state.preview.accountPaused?'恢复示例状态':'停用示例状态'}</button></div><p class="subtle-note">这些操作只改本机虚构状态，不修改真实账号或服务器。</p><div class="review-divider"></div><h3>操作记录</h3><div class="mini-timeline"><p>${notice.published?'公告已在本机预览发布':'公告已撤下或尚未发布'}</p><p>注册${state.preview.registrationOpen?'开放':'关闭'} · 示例</p><p>不提供查看个人日记或 API Key 的按钮。</p></div></section></div>`;}
function showProductForm(id){const product=state.preview.products.find(product=>product.id===id);showPreviewDialog(product?'调整奖励价格':'添加想要的东西',`<div class="form-grid"><label>名称<input id="product-name" value="${esc(product?.name||'')}" maxlength="100" placeholder="例如：留半小时读小说"></label><label>现实价格（元，可填 0）<input id="product-yuan" type="number" min="0" value="${product?.yuan||0}"></label><label>金币价格 · 示例<input id="product-coins" type="number" min="1" step="1" value="${product?.coins||12}"></label></div>`,()=>{const name=document.getElementById('product-name').value.trim(),yuan=Number(document.getElementById('product-yuan').value),coins=Number(document.getElementById('product-coins').value);if(!name||!Number.isFinite(yuan)||yuan<0||!Number.isInteger(coins)||coins<1){modalError('请填写名称、非负现实价格和正整数金币。');return;}if(product)Object.assign(product,{name,yuan,coins});else state.preview.products.push({id:crypto.randomUUID(),name,yuan,coins});persist();closePreviewDialog();render();},'保存示例');}
function routineHandleSettingsAction(action){
  if(action==='save-model'){const model=document.getElementById('model-name').value.trim(),provider=document.getElementById('model-provider').value;if(!model){modelMessage('error','请填写准确的模型 ID。');return;}state.preview.ai={source:'own',provider,model,status:'unverified',version:state.preview.ai.version+1};state.preview.ownModel={...state.preview.ai};persist();render();modelMessage('success','配置已保存，尚未验证；保存不代表模型可用。');return;}
  if(action==='valid-model-example'){document.getElementById('model-provider').value='deepseek';document.getElementById('model-name').value='deepseek-chat';document.getElementById('model-draft-label').textContent='未保存修改';return;}
  if(action==='test-model'){const config=state.preview.ai;if(config.source!=='own')return;if(document.getElementById('model-name').value.trim()!==config.model||document.getElementById('model-provider').value!==config.provider){modelMessage('error','请先保存当前修改，再测试已保存的配置。');return;}config.status='testing';const version=config.version;persist();render();setTimeout(()=>{if(state.preview.ai!==config||state.preview.ai.version!==version||state.preview.ai.source!=='own')return;config.status=(config.provider==='deepseek'&&config.model==='deepseek-chat')||(config.provider==='siliconflow'&&config.model==='XingChenAGI/Xing4.0-29B')?'ready':'failed';state.preview.ownModel={...config};persist();if(currentPage==='settings'){render();modelMessage(config.status==='ready'?'success':'error',config.status==='ready'?'示例验证通过。真实 API 的权限、费用和输出能力仍需正式测试。':'示例错误：找不到这个模型。请核对供应商和完整模型 ID，原配置与输入已保留。');}},350);return;}
  if(action==='change-password'||action==='reset-password'){const recovery=action==='reset-password';showPreviewDialog(recovery?'重设密码 · 仅演示':'修改密码 · 仅演示','<div class="auth-demo">不要填写真实密码；这里不会保存密码或修改正式账号。</div><div class="form-grid">'+(recovery?'':'<label>当前示例密码<input id="password-old" type="password" autocomplete="off"></label>')+'<label>新示例密码<input id="password-new" type="password" autocomplete="off"></label><label>确认新示例密码<input id="password-confirm" type="password" autocomplete="off"></label></div>',()=>{const old=document.getElementById('password-old')?.value,next=document.getElementById('password-new').value,confirm=document.getElementById('password-confirm').value;if((!recovery&&!old)||next.length<12||next!==confirm){modalError(recovery?'新示例密码至少 12 个字符，且两次一致。':'请填写当前示例密码；新密码至少 12 个字符，且两次一致。');return;}closePreviewDialog();toast('示例改密流程完成，没有修改真实账号。');},'确认演示');return;}
  if(action==='change-email'){showPreviewDialog('更换邮箱 · 候选','<p class="dashboard-quote">正式流程需要验证本人身份和新邮箱，不只是填写地址。这里不发送邮件。</p><div class="form-grid"><label>示例新邮箱<input id="new-email" value="new-friend@example.com" type="email"></label></div>',()=>{const email=document.getElementById('new-email').value;if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){modalError('请填写有效的示例邮箱。');return;}state.preview.profile.email=email;persist();closePreviewDialog();render();toast('模拟验证完成，只更新本机示例。');},'模拟验证完成');return;}
  if(action==='logout-devices'){showPreviewDialog('退出其他设备？','<p class="dashboard-quote">正式实现会撤销其他设备会话。这里仅体验确认流程，当前页面会继续保留。</p>',()=>{state.preview.otherSessions=0;persist();closePreviewDialog();render();toast('示例操作完成，没有影响真实设备。');});return;}
